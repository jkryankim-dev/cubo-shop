# =====================================================================
# Netlify 빌드 설정 — CUBO Shop
# =====================================================================
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  # Node 20 LTS (cuboerp 와 동일)
  NODE_VERSION = "20"
  # pnpm 10.x 사용
  PNPM_VERSION = "10"

  # 시크릿 스캐너 false-positive 대응
  # NEXT_PUBLIC_FIREBASE_* 는 의도적으로 클라이언트 번들에 노출되는 값.
  # (Firebase 프로젝트 식별 + 보안은 Firestore Rules 로 보장)
  # FIREBASE_ADMIN_PRIVATE_KEY 는 진짜 시크릿이지만 NEXT_PUBLIC_ 접두사가 없어서
  # Next.js 가 클라이언트 번들에 포함하지 않음 (서버 전용). 변수명에 KEY 가 들어가
  # 스캐너가 의심하므로 명시적으로 omit.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,FIREBASE_ADMIN_PRIVATE_KEY,NEXT_PUBLIC_BUSINESS_NAME,NEXT_PUBLIC_BUSINESS_CEO,NEXT_PUBLIC_BUSINESS_REG_NO,NEXT_PUBLIC_BUSINESS_MAIL_ORDER_NO,NEXT_PUBLIC_BUSINESS_ADDRESS,NEXT_PUBLIC_BUSINESS_PHONE,NEXT_PUBLIC_BUSINESS_EMAIL,NEXT_PUBLIC_TOSS_CLIENT_KEY,TOSS_SECRET_KEY,TOSS_WEBHOOK_SECRET,ERP_SYNC_SECRET,POPBILL_SECRETKEY"
  # Smart Detection 은 환경변수 값의 "패턴" (예: Google API key 형식 AIza...) 을
  # 보고 자동으로 secret 으로 추정하는 기능. NEXT_PUBLIC_FIREBASE_API_KEY 처럼
  # 의도적으로 클라이언트에 노출되는 값까지 잡아 false-positive 발생.
  # OMIT_KEYS (위) 로 충분히 보호되므로 비활성화.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Next.js 공식 플러그인 (Netlify 가 자동 설치하지만 명시)
[[plugins]]
  package = "@netlify/plugin-nextjs"
